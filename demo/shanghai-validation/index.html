<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shanghai Residence Validation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --ink:#16202f; --muted:#65748b; --line:#d9e0ea; --blue:#2563eb; --red:#dc2626; --amber:#d97706; --green:#059669; --panel:#ffffff; --bg:#f4f7fb; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; font-family: "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
    body { display:grid; grid-template-columns: 380px 1fr; grid-template-rows: 58px 1fr; overflow:hidden; }
    header { grid-column:1 / 3; display:flex; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid var(--line); background:#fff; }
    h1 { font-size:18px; margin:0; font-weight:650; }
    .sub { color:var(--muted); font-size:12px; }
    aside { overflow:auto; border-right:1px solid var(--line); background:#fff; padding:14px; }
    main { position:relative; min-width:0; }
    #map { width:100%; height:100%; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
    select, input { width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 9px; background:#fff; color:var(--ink); font-size:13px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fafcff; min-height:58px; }
    .stat span { display:block; color:var(--muted); font-size:11px; }
    .stat b { font-size:19px; line-height:1.6; }
    .section-title { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 8px; }
    .bars { display:grid; gap:6px; margin-bottom:12px; }
    .bar-row { display:grid; grid-template-columns:74px 1fr 62px; gap:8px; align-items:center; font-size:12px; }
    .bar { height:8px; border-radius:999px; background:#e5eaf2; overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--blue); }
    .case-list { display:grid; gap:7px; }
    .case { width:100%; text-align:left; border:1px solid var(--line); border-radius:8px; background:#fff; padding:9px; cursor:pointer; }
    .case:hover { border-color:#aebbd0; }
    .case.active { border-color:var(--blue); box-shadow:0 0 0 2px rgba(37,99,235,.12); }
    .case-top { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .badge { border-radius:999px; padding:2px 7px; background:#eef2ff; color:#3343a2; font-size:11px; white-space:nowrap; }
    .badge.warn { background:#fff7ed; color:#a34d00; }
    .badge.bad { background:#fee2e2; color:#991b1b; }
    .case-meta { margin-top:6px; color:var(--muted); font-size:11px; display:flex; gap:8px; flex-wrap:wrap; }
    .map-panel { position:absolute; right:14px; top:14px; z-index:500; width:min(440px, calc(100% - 28px)); background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:8px; padding:12px; box-shadow:0 10px 30px rgba(15,23,42,.12); }
    .map-panel h2 { margin:0 0 7px; font-size:15px; }
    .map-panel table { width:100%; border-collapse:collapse; font-size:12px; }
    .map-panel td { border-top:1px solid var(--line); padding:6px 2px; }
    .legend { position:absolute; left:12px; bottom:20px; z-index:500; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; box-shadow:0 10px 30px rgba(15,23,42,.12); }
    .legend-row { display:flex; align-items:center; gap:7px; margin:5px 0; }
    .dot { width:11px; height:11px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px #64748b; }
    .T { background:#2563eb; } .C { background:#059669; } .W { background:#7c3aed; } .S { background:#f97316; }
    .Kline { background:#16a34a; } .Vline, .Jline, .Oline { background:#dc2626; } .Bline, .Dline, .Lline, .Tline { background:#d97706; }
    @media (max-width: 900px) { body { grid-template-columns:1fr; grid-template-rows:58px 44vh 1fr; } header { grid-column:1; } aside { grid-row:3; border-right:0; border-top:1px solid var(--line); } main { grid-row:2; } .map-panel { display:none; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Shanghai residence mobile-data validation</h1>
      <div class="sub" id="subtitle">Loading validation payload...</div>
    </div>
    <div class="sub">14-day UUID sample · residence sources</div>
  </header>
  <aside>
    <div class="controls">
      <div>
        <label for="dateFilter">日期</label>
        <select id="dateFilter"></select>
      </div>
      <div>
        <label for="riskFilter">异常等级</label>
        <select id="riskFilter">
          <option value="all">全部</option>
          <option value="severe">高风险</option>
          <option value="drift">有漂移</option>
          <option value="clean">未检出漂移</option>
        </select>
      </div>
      <div style="grid-column:1 / 3">
        <label for="search">UUID 搜索</label>
        <input id="search" type="search" placeholder="输入 UUID 片段">
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>UUID-day 样本</span><b id="statCases">-</b></div>
      <div class="stat"><span>事件记录</span><b id="statEvents">-</b></div>
      <div class="stat"><span>漂移样本率</span><b id="statDrift">-</b></div>
      <div class="stat"><span>高风险样本率</span><b id="statSevere">-</b></div>
    </div>
    <div class="section-title">Daily drift rate</div>
    <div id="dateBars" class="bars"></div>
    <div class="section-title">Cases</div>
    <div id="caseList" class="case-list"></div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="map-panel" id="detailPanel"></div>
    <div class="legend">
      <div class="legend-row"><span class="dot T"></span>Timing</div>
      <div class="legend-row"><span class="dot C"></span>WifiConnect</div>
      <div class="legend-row"><span class="dot W"></span>WifiStable</div>
      <div class="legend-row"><span class="dot S"></span>SceneReco</div>
      <div class="legend-row"><span class="dot Vline"></span>V/J/O 漂移或重叠冲突</div>
      <div class="legend-row"><span class="dot Bline"></span>B/D/L/T 坐标或时间异常</div>
    </div>
  </main>

  <script>
    const fmt = new Intl.NumberFormat("en-US");
    let payload = null;
    let selectedCaseId = null;
    const map = L.map("map", { zoomControl: true }).setView([31.23, 121.47], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const layers = { points: L.layerGroup().addTo(map), lines: L.layerGroup().addTo(map) };
    const colorBySource = { T:"#2563eb", C:"#059669", W:"#7c3aed", S:"#f97316" };
    const anomaly = new Set(["V","J","O","B","D","L","T"]);

    async function init() {
      payload = await fetch("data/validation.json").then(r => r.json());
      document.getElementById("subtitle").textContent = `${payload.generated_at} · ${payload.overall.conclusion}`;
      populateDates();
      renderStats();
      renderDateBars();
      renderCaseList();
      const first = payload.case_summaries[0];
      if (first) selectCase(first.uuid);
    }

    function populateDates() {
      const select = document.getElementById("dateFilter");
      select.innerHTML = `<option value="all">全部日期</option>` + payload.date_summaries.map(d => `<option value="${d.date}">${d.date}</option>`).join("");
      select.addEventListener("change", renderCaseList);
      document.getElementById("riskFilter").addEventListener("change", renderCaseList);
      document.getElementById("search").addEventListener("input", renderCaseList);
    }

    function renderStats() {
      const o = payload.overall;
      document.getElementById("statCases").textContent = fmt.format(o.sample_uuid_days || 0);
      document.getElementById("statEvents").textContent = fmt.format(o.event_count || 0);
      document.getElementById("statDrift").textContent = `${((o.drift_case_rate || 0) * 100).toFixed(1)}%`;
      document.getElementById("statSevere").textContent = `${((o.severe_case_rate || 0) * 100).toFixed(1)}%`;
    }

    function renderDateBars() {
      const max = Math.max(...payload.date_summaries.map(d => d.drift_case_rate || 0), .01);
      document.getElementById("dateBars").innerHTML = payload.date_summaries.map(d => {
        const pct = ((d.drift_case_rate || 0) * 100).toFixed(1);
        return `<div class="bar-row"><span>${d.date.slice(5)}</span><div class="bar"><i style="width:${(d.drift_case_rate / max) * 100}%"></i></div><b>${pct}%</b></div>`;
      }).join("");
    }

    function filteredCases() {
      const date = document.getElementById("dateFilter").value;
      const risk = document.getElementById("riskFilter").value;
      const query = document.getElementById("search").value.trim().toLowerCase();
      return payload.case_summaries.filter(c => {
        if (date !== "all" && c.date !== date) return false;
        if (risk === "severe" && c.quality_score < 40) return false;
        if (risk === "drift" && !(c.drift_count > 0 || c.max_speed_kmh > 200)) return false;
        if (risk === "clean" && (c.drift_count > 0 || c.max_speed_kmh > 200)) return false;
        if (query && !String(c.uuid).toLowerCase().includes(query)) return false;
        return true;
      }).slice(0, 500);
    }

    function renderCaseList() {
      const list = document.getElementById("caseList");
      const cases = filteredCases();
      list.innerHTML = cases.map(c => {
        const cls = c.quality_score >= 40 ? "bad" : (c.drift_count > 0 ? "warn" : "");
        return `<button class="case ${c.uuid === selectedCaseId ? "active" : ""}" onclick="selectCase('${c.uuid.replace(/'/g, "\\'")}')">
          <div class="case-top"><span class="mono">${c.short}</span><span class="badge ${cls}">score ${c.quality_score}</span></div>
          <div class="case-meta">
            <span>${fmt.format(c.event_count)} events</span><span>${c.drift_count} drift</span><span>${c.max_speed_kmh} km/h</span><span>${c.track_span_km} km span</span>
          </div>
        </button>`;
      }).join("") || `<div class="sub">没有匹配样本</div>`;
    }

    function selectCase(id) {
      selectedCaseId = id;
      renderCaseList();
      const c = payload.cases[id];
      renderMap(c);
      renderDetail(c);
    }

    function renderMap(c) {
      layers.points.clearLayers();
      layers.lines.clearLayers();
      const latlngs = [];
      let prev = null;
      for (const e of c.events || []) {
        const [lon, lat, source, status, order, t0, t1, duration, step, speed] = e;
        if (lon == null || lat == null) continue;
        const ll = [lat, lon];
        latlngs.push(ll);
        if (prev) {
          L.polyline([prev, ll], { color: anomaly.has(status) ? "#dc2626" : "#64748b", weight: anomaly.has(status) ? 3 : 1.5, opacity:.65 }).addTo(layers.lines);
        }
        L.circleMarker(ll, {
          radius: anomaly.has(status) ? 6 : 4,
          color: anomaly.has(status) ? "#111827" : "#fff",
          weight: anomaly.has(status) ? 2 : 1,
          fillColor: colorBySource[source] || "#64748b",
          fillOpacity: .86
        }).bindTooltip(`#${order} ${source} ${status}<br>${t0} - ${t1}<br>step ${step ?? "-"} km · speed ${speed ?? "-"} km/h`).addTo(layers.points);
        prev = ll;
      }
      if (latlngs.length) map.fitBounds(latlngs, { padding:[30,30], maxZoom:15 });
    }

    function renderDetail(c) {
      const rows = [
        ["UUID", `<span class="mono">${c.raw_uuid}</span>`],
        ["日期", c.date],
        ["事件数", fmt.format(c.event_count)],
        ["漂移/冲突", c.drift_count],
        ["最大速度", `${c.max_speed_kmh} km/h`],
        ["最大跳跃", `${c.max_step_km} km`],
        ["轨迹跨度", `${c.track_span_km} km`],
        ["长时长/负时长", `${c.long_duration} / ${c.negative_duration}`],
        ["上海范围外", c.out_bbox],
        ["来源构成", Object.entries(c.source_counts || {}).map(([k,v]) => `${k}:${v}`).join(" · ")]
      ];
      document.getElementById("detailPanel").innerHTML = `<h2>${c.short}</h2><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
    }

    init().catch(err => {
      document.getElementById("subtitle").textContent = err.message;
      console.error(err);
    });
  </script>
</body>
</html>

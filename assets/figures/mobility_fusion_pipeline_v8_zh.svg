<text x="114" y="2360" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="33" font-weight="700" fill="#087f80">减少重复存储，保持精确还原</text>
<text x="114" y="2418" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">类型化区间、字典、引用及残差编码</text>
<text x="114" y="2466" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">保留位值、NULL、字段语义与表间关系</text>

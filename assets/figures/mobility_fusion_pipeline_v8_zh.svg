<text x="75" y="2690" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#617b89">算法与工程框架｜2026-10-28｜箭头表示数据流；第 04 层为执行支撑。性能收益依据独立对照，不由并发数推断。</text>

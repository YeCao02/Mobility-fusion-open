<text x="2259" y="795" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="35" font-weight="700" fill="#a45117">全链一致性闭环</text>
<text x="2259" y="853" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">检查顺序、间隙与时间重叠</text>
<text x="2259" y="901" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">考虑速度不确定性与可达性</text>
<text x="2259" y="949" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">区分局部边界许可与未决项</text>

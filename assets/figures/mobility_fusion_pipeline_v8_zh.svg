<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2740" viewBox="0 0 3000 2740" role="img" aria-labelledby="title desc">
<title id="title">Mobility Fusion：多源定位融合、完整日链与可恢复生产</title>
<desc id="desc">五层流程：统一事件，证据融合，日链与七表，计算优化，存储验收与应用。科学处理与执行控制分层展示。</desc>
<rect width="3000" height="2740" fill="white"/>
<text x="65" y="38" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="62" font-weight="700" fill="#105d87">Mobility Fusion｜多源定位证据融合与完整日内 OD 链</text>
<text x="70" y="125" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="400" fill="#4c6b7d">从异质手机事件到可解释节点、连续连线、精确存储与可恢复全量生产</text>

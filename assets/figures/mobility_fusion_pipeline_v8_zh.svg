<text x="114" y="2046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">精确有界配对，原生构链热点</text>
<rect x="1015" y="1920" width="875" height="180" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="1039" y="1940" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="33" font-weight="700" fill="#655596">按真实资源动态派发</text>
<text x="1039" y="1998" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">监测提交额度、物理内存和磁盘</text>
<text x="1039" y="2046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">迟滞降并发、独立保护与进程回收</text>

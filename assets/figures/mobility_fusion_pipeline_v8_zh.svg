<text x="85" y="1860" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#516d7b">执行并发与科学计划分离：完整用户不拆丢，已成功提交的分区恢复后复用。</text>

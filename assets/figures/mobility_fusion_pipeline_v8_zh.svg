<text x="85" y="2275" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#516d7b">Parquet 保存唯一载荷，字典 / schema / catalog / reader 共同定义完整可查询包。</text>

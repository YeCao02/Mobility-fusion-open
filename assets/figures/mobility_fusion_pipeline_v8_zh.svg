<text x="2024" y="2466" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">时空与活动分析；原始观测—识别结果回放</text>

<text x="1459" y="1458" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">nodes · segments：节点、时间和相邻连线</text>
<text x="1459" y="1506" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">semantic_facts · semantic_links · semantic_conflicts：语义及关系</text>
<text x="1459" y="1554" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">boundary_audit · source_quality_audit：边界和来源审计</text>

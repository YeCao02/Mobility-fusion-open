<text x="1069" y="2360" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="33" font-weight="700" fill="#087f80">逐分区提交与全包验收</text>
<text x="1069" y="2418" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">prepared → COMMIT → COMPLETE</text>
<text x="1069" y="2466" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">完整载荷 SHA / 精确回读 → CURRENT 发布</text>

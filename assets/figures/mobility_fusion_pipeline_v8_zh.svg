<text x="85" y="1255" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="43" font-weight="700" fill="#377f3c">03  构造完整日链与七类结果表</text>
<text x="85" y="1315" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#516d7b">按可用观测构造有序节点及相邻 OD；不补造缺失日期，也不将节点连线当作道路导航轨迹。</text>
<rect x="90" y="1380" width="1230" height="275" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="114" y="1400" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="700" fill="#116e9b">物理日链：节点与相邻 OD</text>
<text x="114" y="1458" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">DAY_START  →  STAY / STOP  →  …  →  DAY_END</text>
<text x="114" y="1506" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">相邻节点按时间顺序连接；保留重复到访</text>
<text x="114" y="1554" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">节点时间、证据包络、物理有效性与分析许可分开</text>

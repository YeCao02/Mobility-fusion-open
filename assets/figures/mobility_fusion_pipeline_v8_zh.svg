<text x="85" y="225" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="43" font-weight="700" fill="#176f9d">01  统一输入与时空表达</text>
<text x="85" y="285" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#516d7b">输入合同确定字段、时间和坐标含义；标准化只做一次，保留来源与质量信息。</text>
<rect x="90" y="335" width="850" height="192" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="114" y="355" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="700" fill="#116e9b">四类互补观测</text>
<text x="114" y="413" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">SceneReco  场景与地点语义  /  WiFiConnect  连接证据</text>
<text x="114" y="461" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">WiFiStable  稳定驻留证据  /  Timing  移动过程位置</text>
<path d="M955 430 L1015 430" stroke="#46768c" stroke-width="5" fill="none"/><polygon points="1015,430 995,419 995,441" fill="#46768c"/>
<rect x="1030" y="335" width="865" height="192" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="1054" y="355" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="700" fill="#116e9b">标准化事件</text>
<text x="1054" y="413" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">统一字段与 UTC+8 毫秒时间；校验坐标状态</text>
<text x="1054" y="461" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">保留有效记录、显式隔离项与来源质量</text>
<path d="M1910 430 L1970 430" stroke="#46768c" stroke-width="5" fill="none"/><polygon points="1970,430 1950,419 1950,441" fill="#46768c"/>
<rect x="1985" y="335" width="920" height="192" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="2009" y="355" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="34" font-weight="700" fill="#116e9b">空间索引与完整身份上下文</text>
<text x="2009" y="413" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">H3 res10：事件与节点；res9：父级聚合索引</text>
<text x="2009" y="461" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">按 UUID 不交叠分区；保留可用跨日上下文</text>
<path d="M1500 578 L1500 610" stroke="#46768c" stroke-width="5" fill="none"/><polygon points="1500,610 1489,590 1511,590" fill="#46768c"/>
<rect x="55" y="620" width="2890" height="565" rx="16" fill="#fff5ec" stroke="#bd5c18" stroke-width="2"/>
<text x="85" y="640" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="43" font-weight="700" fill="#bd5c18">02  可解释证据融合与轨迹一致性</text>
<text x="85" y="700" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#516d7b">默认来源优先级：SceneReco ＞ WiFiConnect ＞ WiFiStable ＞ Timing；结合持续支持与时空上下文裁决。</text>
<rect x="90" y="775" width="670" height="270" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="114" y="795" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="35" font-weight="700" fill="#a45117">局部可靠性增强</text>
<text x="114" y="853" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">识别重叠、漂移与冲突候选</text>
<text x="114" y="901" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">保留实际成员格与时间片支持</text>
<text x="114" y="949" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">形成可追溯的活动候选</text>
<path d="M768 910 L795 910" stroke="#b46a34" stroke-width="5" fill="none"/><polygon points="795,910 775,899 775,921" fill="#b46a34"/>
<rect x="805" y="775" width="670" height="270" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="829" y="795" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="35" font-weight="700" fill="#a45117">直接冲突裁决</text>
<text x="829" y="853" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">按来源、评分与上下文选赢家</text>
<text x="829" y="901" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">仅直接冲突才具备删除资格</text>
<text x="829" y="949" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">避免传递连通造成连带误删</text>
<path d="M1483 910 L1510 910" stroke="#b46a34" stroke-width="5" fill="none"/><polygon points="1510,910 1490,899 1490,921" fill="#b46a34"/>
<rect x="1520" y="775" width="670" height="270" rx="16" fill="white" stroke="#c7d9e2" stroke-width="2"/>
<text x="1544" y="795" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="35" font-weight="700" fill="#a45117">H3 时空聚合</text>
<text x="1544" y="853" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">相邻格吸收与短时抖动处理</text>
<text x="1544" y="901" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">恢复边界与碎片，联合选时</text>
<text x="1544" y="949" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">保留聚合成员的证据支持</text>
<path d="M2198 910 L2225 910" stroke="#b46a34" stroke-width="5" fill="none"/><polygon points="2225,910 2205,899 2205,921" fill="#b46a34"/>

<text x="1964" y="1998" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">任务完成前精确回读与关系校验</text>
<text x="1964" y="2046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#233e50">成功 COMMIT 复用；仅未提交部分重做</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .title{font:800 27px "Microsoft YaHei UI","Microsoft YaHei","SimHei",sans-serif;fill:#0b5793}
      .sub{font:600 11px "Microsoft YaHei UI","Microsoft YaHei","SimHei",sans-serif;fill:#52687b}
      .head{font:800 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}
      .h2{font:800 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173d5e}
      .h3{font:800 13px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173d5e}
      .body{font:600 11px "Microsoft YaHei UI","Microsoft YaHei","SimHei",sans-serif;fill:#294055}
      .small{font:600 10px "Microsoft YaHei UI","Microsoft YaHei","SimHei",sans-serif;fill:#52687b}
      .center{text-anchor:middle}.white{fill:#fff}
      .card{fill:#fff;stroke:#a9bfd2;stroke-width:1.5;rx:8}
      .blueCard{fill:#eff7fc;stroke:#72a8cf;stroke-width:1.5;rx:8}
      .orangeCard{fill:#fff5eb;stroke:#df9a60;stroke-width:1.5;rx:8}
      .greenCard{fill:#eff8ed;stroke:#82b173;stroke-width:1.5;rx:8}
      .tealCard{fill:#edf8f6;stroke:#6dafaa;stroke-width:1.5;rx:8}
      .purpleCard{fill:#f5f1fa;stroke:#a088c1;stroke-width:1.5;rx:8}
      .arrow{stroke:#34708f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#34708f" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6d8296" flood-opacity=".16" />
    </filter>
  </defs>

  <rect width="1600" height="920" fill="#f8fbfd" />
  <rect width="1600" height="92" fill="#fff" />
  <rect width="18" height="92" fill="#0b65a8" />
  <text x="48" y="50" class="title">Multi-source Mobile SDK Data Fusion and Daily OD Cleaning-Aggregation Framework</text>
  <text x="50" y="78" class="sub">Interpretable spatiotemporal evidence fusion, trajectory aggregation, and continuous OD construction for massive heterogeneous mobile events</text>

  <rect x="30" y="112" width="1540" height="112" fill="#edf5fa" stroke="#b8cfdf" rx="8" />
  <rect x="55" y="132" width="360" height="72" class="blueCard" filter="url(#shadow)" />
  <text x="235" y="160" class="h2 center">Heterogeneous raw events</text>
  <text x="235" y="187" class="body center">Different sources, accuracy, semantics, and reporting rhythms</text>
  <path d="M430 168H570" class="arrow" />
  <rect x="585" y="126" width="430" height="84" class="orangeCard" filter="url(#shadow)" />
  <text x="800" y="157" class="h2 center" style="fill:#a6501a">Interpretable evidence fusion</text>
  <text x="800" y="184" class="body center">Unified spatial cells | multi-source arbitration | spatiotemporal consistency checks</text>
  <path d="M1030 168H1170" class="arrow" />
  <rect x="1185" y="132" width="360" height="72" class="greenCard" filter="url(#shadow)" />
  <text x="1365" y="160" class="h2 center" style="fill:#2e6c32">Auditable daily OD chain</text>
  <text x="1365" y="187" class="body center">Ordered move/stay nodes with traceable evidence</text>

  
  <rect x="30" y="246" width="380" height="554" fill="#f1f7fb" stroke="#72a8cf" stroke-width="2" rx="8" />
  <rect x="30" y="246" width="380" height="54" fill="#0b65a8" rx="8" />
  <rect x="30" y="282" width="380" height="18" fill="#0b65a8" />
  <text x="220" y="281" class="head center">I. Data input and unified representation</text>

  <rect x="50" y="320" width="340" height="170" class="card" />
  <text x="220" y="350" class="h2 center">Four complementary evidence types</text>
  <circle cx="82" cy="382" r="13" fill="#2463a8" /><text x="82" y="387" class="small white center">S</text>
  <text x="108" y="388" class="body">SceneReco: semantic place evidence</text>
  <circle cx="82" cy="414" r="13" fill="#167d6d" /><text x="82" y="419" class="small white center">C</text>
  <text x="108" y="420" class="body">WiFiConnect: association evidence</text>
  <circle cx="82" cy="446" r="13" fill="#6c4aa1" /><text x="82" y="451" class="small white center">W</text>
  <text x="108" y="452" class="body">WiFiStable: high-coverage stay evidence</text>
  <circle cx="82" cy="478" r="13" fill="#df6a1e" /><text x="82" y="483" class="small white center">T</text>
  <text x="108" y="484" class="body">Timing: in-motion location evidence</text>

  <rect x="50" y="510" width="340" height="170" class="blueCard" />
  <text x="220" y="540" class="h2 center">Standardization and spatial encoding</text>
  <text x="72" y="570" class="body">| Unified fields, UTC+8 time, and coordinate semantics</text>
  <text x="72" y="600" class="body">| H3 res10: event localization and daily-chain node cells</text>
  <text x="72" y="630" class="body">| H3 res9: parent index and regional aggregation scale</text>
  <text x="72" y="660" class="small">Two H3 levels are retained for scale conversion and aggregation analysis</text>

  <path d="M220 684V716" class="arrow" />
  <rect x="50" y="724" width="340" height="56" fill="#0b65a8" rx="8" />
  <text x="220" y="748" class="h3 white center">Standardized event shards</text>
  <text x="220" y="770" class="small white center">UUID ranges | Parquet | resumable processing</text>

  
  <rect x="430" y="246" width="740" height="554" fill="#fffdf9" stroke="#db8c4b" stroke-width="2.4" rx="8" />
  <rect x="430" y="246" width="740" height="54" fill="#dc6b24" rx="8" />
  <rect x="430" y="282" width="740" height="18" fill="#dc6b24" />
  <text x="800" y="281" class="head center">II. Core algorithm: multi-source evidence fusion and trajectory consistency</text>

  <rect x="450" y="320" width="700" height="54" class="orangeCard" />
  <text x="800" y="343" class="h3 center">Source priority</text>
  <text x="800" y="366" class="body center">SceneReco &gt; WiFiConnect &gt; WiFiStable &gt; Timing</text>

  <rect x="450" y="394" width="335" height="166" class="purpleCard" />
  <circle cx="482" cy="424" r="18" fill="#6c4aa1" /><text x="482" y="430" class="h3 white center">1</text>
  <text x="512" y="430" class="h3">Local reliability enhancement</text>
  <text x="472" y="466" class="body">| Local clustering and multi-source support</text>
  <text x="472" y="497" class="body">| Overlap conflicts and drift detection</text>
  <text x="472" y="528" class="body">| Traceable keep/drop reasons</text>

  <rect x="815" y="394" width="335" height="166" class="greenCard" />
  <circle cx="847" cy="424" r="18" fill="#3b7d3a" /><text x="847" y="430" class="h3 white center">2</text>
  <text x="877" y="430" class="h3">Evidence arbitration</text>
  <text x="837" y="466" class="body">| Source priority and persistence</text>
  <text x="837" y="497" class="body">| Context comparison for conflicting locations</text>
  <text x="837" y="528" class="body">| Trusted activity candidates</text>

  <rect x="450" y="580" width="335" height="166" class="blueCard" />
  <circle cx="482" cy="610" r="18" fill="#0b65a8" /><text x="482" y="616" class="h3 white center">3</text>
  <text x="512" y="616" class="h3">H3 spatiotemporal aggregation</text>
  <text x="472" y="652" class="body">| Adaptive neighbor absorption</text>
  <text x="472" y="683" class="body">| Boundary de-jittering and fragment recovery</text>
  <text x="472" y="714" class="body">| Absorbed evidence sets retained</text>

  <rect x="815" y="580" width="335" height="166" class="tealCard" />
  <circle cx="847" cy="610" r="18" fill="#197c78" /><text x="847" y="616" class="h3 white center">4</text>
  <text x="877" y="616" class="h3">Trajectory consistency closure</text>
  <text x="837" y="652" class="body">| Temporal order and movement plausibility</text>
  <text x="837" y="683" class="body">| Path direction and transport context</text>
  <text x="837" y="714" class="body">| Anomalous-node and boundary repair</text>

  <rect x="450" y="758" width="700" height="24" fill="#dc6b24" rx="6" />
  <text x="800" y="775" class="small white center">Decisions: retained nodes | neighbor absorption | anomaly pruning | quality tags</text>

  
  <rect x="1190" y="246" width="380" height="554" fill="#f2f8ef" stroke="#82b173" stroke-width="2" rx="8" />
  <rect x="1190" y="246" width="380" height="54" fill="#3b7d3a" rx="8" />
  <rect x="1190" y="282" width="380" height="18" fill="#3b7d3a" />
  <text x="1380" y="281" class="head center">III. FULL_OD daily chain and audit outputs</text>

  <rect x="1210" y="320" width="340" height="230" class="card" />
  <text x="1380" y="350" class="h2 center">Complete daily node chain</text>
  <rect x="1300" y="370" width="160" height="38" class="blueCard" /><text x="1380" y="395" class="body center">DAY_START</text>
  <path d="M1380 410V434" class="arrow" />
  <rect x="1230" y="440" width="138" height="50" class="greenCard" /><text x="1299" y="461" class="h3 center">STAY</text><text x="1299" y="481" class="small center">Stable activity anchor</text>
  <rect x="1392" y="440" width="138" height="50" class="orangeCard" /><text x="1461" y="461" class="h3 center">STOP</text><text x="1461" y="481" class="small center">Trusted movement node</text>
  <path d="M1380 494V516" class="arrow" />
  <rect x="1300" y="516" width="160" height="26" class="blueCard" /><text x="1380" y="535" class="body center">DAY_END</text>

  <rect x="1210" y="570" width="340" height="100" class="greenCard" />
  <text x="1380" y="600" class="h2 center">Adjacent nodes derive OD</text>
  <text x="1380" y="632" class="body center">Preserves daily order, revisits, and cross-city links</text>
  <text x="1380" y="656" class="small center">Separates physical validity from analytical retention</text>

  <rect x="1210" y="690" width="340" height="90" class="tealCard" />
  <text x="1380" y="720" class="h2 center">Compact outputs and validation</text>
  <text x="1380" y="750" class="body center">Node table | OD table | QC audit | validation browser</text>
  <text x="1380" y="772" class="small center">Supports activity-center and intercity mobility analysis</text>

  
  <rect x="30" y="822" width="1540" height="70" fill="#fff" stroke="#a9bfd2" stroke-width="1.6" rx="8" />
  <text x="170" y="852" class="h2 center">Interpretable</text><text x="170" y="878" class="small center">Traceable decisions</text>
  <text x="560" y="852" class="h2 center">Continuous</text><text x="560" y="878" class="small center">Complete daily order</text>
  <text x="950" y="852" class="h2 center">Scalable</text><text x="950" y="878" class="small center">Large-scale sharded computation</text>
  <text x="1340" y="852" class="h2 center">Auditable</text><text x="1340" y="878" class="small center">Validation browser and QC audit</text>
</svg>